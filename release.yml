name: Publish tagged release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-release.mjs
      - run: npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_VERSION"
          dist/main.js dist/manifest.json dist/styles.css
          dist/LICENSE dist/THIRD_PARTY_NOTICES.md
          dist/github-sync-zev-*.zip dist/SHA256SUMS
          --repo "$PUBLIC_REPOSITORY"
          --title "GitHub Sync - Zev $RELEASE_VERSION"
          --notes-file CHANGELOG.md
