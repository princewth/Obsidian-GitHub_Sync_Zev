name: Build and publish plugin
on:
  push:
    branches: ['main']
    paths:
      - 'manifest.json'
      - '.github/workflows/release.yml'
    tags: ['[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-plugin-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-release.mjs
      - run: npm run package
      - name: Publish matching release and attach required files
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
          RELEASE_NAME="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).name')"
          if ! gh release view "$RELEASE_VERSION" --repo "$PUBLIC_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$PUBLIC_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$RELEASE_NAME $RELEASE_VERSION" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_VERSION" dist/main.js dist/manifest.json dist/styles.css dist/LICENSE dist/THIRD_PARTY_NOTICES.md dist/github-sync-zev-*.zip dist/SHA256SUMS --repo "$PUBLIC_REPOSITORY" --clobber
          gh release edit "$RELEASE_VERSION" --repo "$PUBLIC_REPOSITORY" --title "$RELEASE_NAME $RELEASE_VERSION" --notes-file CHANGELOG.md --draft=false
      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const release = JSON.parse(execFileSync('gh', ['release', 'view', manifest.version, '--repo', process.env.PUBLIC_REPOSITORY, '--json', 'tagName,name,isDraft,assets'], {encoding:'utf8'}));
          if (release.tagName !== manifest.version || release.isDraft || !release.name.includes(manifest.version)) throw new Error('Release metadata does not match manifest.');
          for (const name of ['main.js', 'manifest.json', 'styles.css']) {
            if (!release.assets.some(asset => asset.name === name && asset.size > 0)) throw new Error(`Missing release asset: ${name}`);
          }
          console.log('Matching published release and all required assets verified.');
          JS
